<section id="benefits">
  <h2>¿Cuáles son nuestras ventajas sobre los competidores?</h2>
  <div class="container benefits-section">
    @for (benefit of benefits; track benefit.title) {
      <div class="benefit-item">
        <h3>{{ benefit.title }}</h3>
        <p>{{ benefit.description }}</p>
      </div>
    }
  </div>
</section>
