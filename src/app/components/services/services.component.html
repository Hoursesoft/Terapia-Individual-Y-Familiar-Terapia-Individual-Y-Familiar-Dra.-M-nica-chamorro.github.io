<section id="services">
  <div class="container">
    <div class="section-service">
      <h2>Servicios ofrecidos</h2>

      <div class="service-list">
        @for (service of services; track service.id) {
          <div class="service-item">
            <div class="service-column">
              @if (service.hasGallery) {
                <img
                  [src]="service.thumbnail || service.image"
                  [alt]="service.alt"
                  class="thumbnail"
                  (click)="openGallery(service.image, service.title, service.description)"
                />
              } @else {
                <img [src]="service.image" [alt]="service.alt" />
              }
              <h3>{{ service.title }}</h3>
              @if (service.description) {
                <p>{{ service.description }}</p>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>

  @if (lightboxOpen()) {
    <div class="lightbox" (click)="closeGallery()">
      <span class="close">&times;</span>
      <img class="lightbox-content" [src]="lightboxImage()" [alt]="lightboxTitle()" />
      <div class="caption">
        <h4>{{ lightboxTitle() }}</h4>
        <p>{{ lightboxDescription() }}</p>
      </div>
    </div>
  }
</section>
